name: Deploy Shinylive Dashboard

on:
  push:
    branches: [dashboard]
  schedule:
    - cron: "0 6 * * 5"   # every Friday at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.5"
          use-public-rspm: true

      - name: Install dependencies
        env:
          GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
        run: |
          install.packages(c(
            'remotes',
            'dplyr', 'tidyr', 'janitor', 'stringr',
            'shiny', 'bslib', 'ggplot2', 'pROC',
            'plotly', 'lubridate', 'shinylive'
          ))
          remotes::install_github('bergant/airtabler')
        shell: Rscript {0}  

      - name: Fetch Airtable data
        env:
          AIRTABLE_API_KEY: ${{ secrets.AIRTABLE_API_KEY }}
        run: Rscript scripts/fetch_dashboard_data.R

      - name: Export Shinylive app
        run: Rscript -e "shinylive::export('dashboard', 'site')"

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
          force_orphan: true
